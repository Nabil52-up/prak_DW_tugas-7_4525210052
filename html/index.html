
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pencarian Mahasiswa</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <main class="container">
        <section class="form-card">

            <h1>Pencarian Data Mahasiswa</h1>

            <p class="description">
                Gunakan form berikut untuk mencari data mahasiswa
                berdasarkan nama, NIM, angkatan, atau tanggal masuk.
            </p>

            <!-- Form pencarian menggunakan method GET -->
            <form action="hasil-pencarian.html" method="get">

                <!-- Input Nama -->
                <div class="form-group">
                    <label for="nama">Nama Mahasiswa</label>
                    <input
                        type="text"
                        id="nama"
                        name="nama"
                        placeholder="Masukkan nama mahasiswa">
                </div>

                <!-- Input NIM -->
                <div class="form-group">
                    <label for="nim">NIM</label>
                    <input
                        type="text"
                        id="nim"
                        name="nim"
                        placeholder="Contoh: 20260001">
                </div>

                <!-- Input Tahun Angkatan -->
                <div class="form-group">
                    <label for="angkatan">Tahun Angkatan</label>
                    <input
                        type="number"
                        id="angkatan"
                        name="angkatan"
                        min="2020"
                        max="2030"
                        placeholder="2026">
                </div>

                <!-- Input Tanggal Masuk -->
                <div class="form-group">
                    <label for="tanggal">Tanggal Masuk</label>
                    <input
                        type="date"
                        id="tanggal"
                        name="tanggal">
                </div>

                <!-- Tombol -->
                <div class="button-group">
                    <button
                        type="submit"
                        class="btn btn-primary">
                        Cari Data
                    </button>

                    <button
                        type="reset"
                        class="btn btn-secondary">
                        Reset
                    </button>

                    <button
                        type="button"
                        class="btn btn-neutral"
                        onclick="alert('Silakan isi salah satu kolom untuk mencari data mahasiswa.')">
                        Bantuan
                    </button>
                </div>

            </form>

        </section>
    </main>

</body>
</html>
